name: Build DG1 PVE kernel

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dg1-kernel-latest-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_CONTAINER: dg1-kernel-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_TAG: pve-latest-${{ github.sha }}-dg1

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages in Debian Trixie
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          chmod 0777 "$GITHUB_WORKSPACE/dist"
          docker pull debian:trixie
          docker create --name "$BUILD_CONTAINER" debian:trixie sleep infinity
          docker start "$BUILD_CONTAINER"
          DG1_PATCH_B64=$(base64 --wrap=0 \
            "$GITHUB_WORKSPACE/patches/kernel/0035-pci-add-dg1-passthrough-quirk.patch")
          test -n "$DG1_PATCH_B64"
          docker exec \
            --env BUILD_COMMIT="$GITHUB_SHA" \
            --env DG1_PATCH_B64="$DG1_PATCH_B64" \
            --env PATCH_REPOSITORY="$GITHUB_REPOSITORY" \
            --workdir /tmp \
            "$BUILD_CONTAINER" \
            bash -Eeuxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive

              on_error() {
                rc=$?
                echo "BUILD FAILED: ${BASH_SOURCE[1]}:${BASH_LINENO[0]}: ${BASH_COMMAND} (exit ${rc})" >&2
                exit "$rc"
              }
              trap on_error ERR

              apt-get update
              apt-get install -y --no-install-recommends \
                bc \
                bison \
                build-essential \
                ca-certificates \
                cpio \
                devscripts \
                dwarves \
                equivs \
                fakeroot \
                flex \
                git \
                gnupg \
                libelf-dev \
                libssl-dev \
                rsync \
                wget \
                xz-utils

              rm -rf /tmp/pve-kernel
              git clone --depth 1 --no-recurse-submodules \
                https://github.com/proxmox/pve-kernel.git /tmp/pve-kernel

              test -d /tmp/pve-kernel
              echo "Cloned pve-kernel directory:"
              ls -ld /tmp/pve-kernel
              cd /tmp/pve-kernel || { echo "Cannot enter /tmp/pve-kernel" >&2; exit 1; }
              echo "Working directory: $(pwd)"
              # Use Proxmox's public Git service for the historical GitHub
              # mirror without writing any Git config files.
              echo "Filesystem status before submodule initialization:"
              df -h /tmp
              df -i /tmp
              du -sh /tmp/pve-kernel 2>/dev/null || true
              echo "Starting kernel source submodule initialization"
              set +e
              git -c "url.https://git.proxmox.com/git/.insteadOf=https://github.com/proxmox/" \
                submodule update --init --recursive
              submodule_status=$?
              set -e
              echo "Submodule initialization exit code: $submodule_status"
              test "$submodule_status" -eq 0
              echo "Kernel source submodules initialized"

              mkdir -p /tmp/pve-kernel/patches/kernel
              mkdir -p /tmp/output
              printf "%s" "$DG1_PATCH_B64" | base64 --decode \
                > /tmp/dg1-passthrough-quirk.patch
              test -s /tmp/dg1-passthrough-quirk.patch
              cp /tmp/dg1-passthrough-quirk.patch \
                /tmp/pve-kernel/patches/kernel/9999-pci-add-dg1-passthrough-quirk.patch

              sed -i -E "s/^[[:space:]]*KREL_EXTRA[[:space:]]*=.*/KREL_EXTRA=-dg1/" Makefile
              grep -q "KREL_EXTRA=-dg1" Makefile

              source_commit=$(git rev-parse HEAD)
              # Add a local package revision to distinguish this build from
              # the unmodified package produced by Proxmox.
              first_line=$(head -n 1 debian/changelog)
              dch --distribution trixie --urgency medium \
                --local +dg1 \
                "Add Intel DG1 passthrough quirk"
              test "$(head -n 1 debian/changelog)" != "$first_line"

              make build-dir-fresh
              build_dir=$(find . -maxdepth 1 -type d -name "proxmox-kernel-*" -print -quit)
              test -n "$build_dir"

              mk-build-deps -ir -t "apt-get -y" "$build_dir/debian/control"
              make deb

              patched_source="$build_dir/ubuntu-kernel/drivers/pci/quirks.c"
              test -f "$patched_source"
              grep -q "quirk_intel_dg1_pve_fix" "$patched_source"
              grep -q "PCI_DEV_FLAGS_NO_FLR_RESET" "$patched_source"

              find . -type f -name "*.deb" -size +0c -exec cp -v {} /tmp/output/ \
                \;
              test -n "$(find /tmp/output -maxdepth 1 -type f -name "*.deb" -print -quit)"
              find /tmp/output -maxdepth 1 -type f -name "*.deb" -print0 \
                | xargs -0 -n1 dpkg-deb --info >/dev/null

              if ! find /tmp/output -maxdepth 1 -type f -name "*kernel*.deb" -print -quit | grep -q .; then
                echo "No kernel package was produced" >&2
                exit 1
              fi

              sha256sum /tmp/output/*.deb > /tmp/output/SHA256SUMS
              {
                echo "PVE package version: $(dpkg-parsechangelog -S Version)"
                echo "PVE commit: $source_commit"
                echo "Patch repository: $PATCH_REPOSITORY"
                echo "Patch commit: $BUILD_COMMIT"
                echo "Architecture: amd64"
                echo "Builder image: debian:trixie"
              } > /tmp/output/build-info.txt
            ' 2>&1 | tee build.log
          docker cp "$BUILD_CONTAINER:/tmp/output/." "$GITHUB_WORKSPACE/dist/"

      - name: Upload build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: dg1-kernel-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Remove build container
        if: always()
        run: docker rm --force "$BUILD_CONTAINER" || true

      - name: Verify release contents
        run: |
          test -s dist/SHA256SUMS
          test -s dist/build-info.txt
          sha256sum --check dist/SHA256SUMS
          test -n "$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          DG1 passthrough kernel packages for the selected PVE kernel.

          - Architecture: amd64
          - Kernel package revision: dg1
          - The packages include the Intel DG1 PCI reset/config-space workaround.
          - Verify downloads with: sha256sum -c SHA256SUMS

          These packages are intended for testing and should be installed only
          after confirming compatibility with the target Proxmox VE node.
          EOF
          gh release create "$RELEASE_TAG" dist/* \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
